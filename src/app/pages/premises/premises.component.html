<h1>LOCALES</h1>
<p-table [value]="premisesList" [reorderableColumns]="true" [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name" pReorderableColumn>NAME
        <p-sortIcon field="name"/>
      </th>
      <th pReorderableColumn>
        <p-columnFilter type="text" field="address" display="menu"/>
        ADDRESS
      </th>
      <th pReorderableColumn>PHONE NUMBER</th>
      <th pReorderableColumn>WEB</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-premise>
    <tr>
      <td (click)=getById(premise.id)>{{ premise.name }}</td>
      <td>{{ premise.address }}</td>
      <td>{{ premise.phone_number }}</td>
      <td>{{ premise.web }}</td>
    </tr>
  </ng-template>
</p-table>

<div class="flex" *ngFor="let premise of premisesList" >
  <p-card header="{{premise.name}}" subheader="{{premise.address}}" [style]="{ width: '360px' }">
    <ng-template pTemplate="header">
      <img alt="Card" src="/logo.png"/> <!--{{premise.imgUrl}}-->
    </ng-template>
    <p>
      {{ premise.schedule }}
    </p>
    <ng-template pTemplate="footer">
      <div class="flex gap-3 mt-1">
        <p-button label="Próximos eventos" routerLink="events" severity="secondary" class="w-full" styleClass="w-full"/>
        <p-button label="{{premise.web}}" class="w-full" styleClass="w-full"/>
      </div>
    </ng-template>
  </p-card>
</div>
