<div class="surface-card p-4 shadow-2 border-round w-full lg:w-6">
  <div class="text-center mb-5">
    <img ngSrc="/imgRegisterBig.png" alt="Image" height="200" width="250" class="mb-3">
    <div class="text-900 text-3xl font-medium mb-3">Bienvenido bailarina o bailarín</div>
    <span class="text-600 font-medium line-height-3">¿Aún no tienes una cuenta?</span>
    <a routerLink="/register" class="font-medium no-underline ml-2 text-blue-500 cursor-pointer">Pincha aquí para crearla!</a>
  </div>

  <div>
    <form [formGroup]="loginForm">
    <label for="email" class="block text-900 font-medium mb-2">Email</label>
    <input [formControlName]="'email'" id="email" type="text" placeholder="Email address" pInputText class="w-full mb-3">

    <label for="password" class="block text-900 font-medium mb-2">Contraseña: </label>
    <input [formControlName]="'password'" id="password" type="password" placeholder="Password" pInputText class="w-full mb-3">

    <div class="flex align-items-center justify-content-between mb-6">

<!--      <div class="flex align-items-center">-->
<!--        <p-checkbox id="rememberme1" [binary]="true" styleClass="mr-2"></p-checkbox>-->
<!--        <label for="rememberme1" class="text-900">Recuérdame</label>-->
<!--      </div>-->

      <a class="font-medium no-underline ml-2 text-blue-500 text-right cursor-pointer">Olvidaste tu contraseña?</a>
    </div>

    <button routerLink="myaccount" (click)="login()" pButton pRipple label="Entra a tu cuenta" icon="pi pi-user" class="w-full"></button>
    </form>
  </div>
</div>
